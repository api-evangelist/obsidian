openapi: 3.2.0
info:
  description: You can use this interface for trying out your Local REST API in Obsidian.
  title: Local REST API for Obsidian Commands API
  version: '1.0'
servers:
- description: HTTPS (Secure Mode)
  url: https://{host}:{port}
  variables:
    host:
      default: 127.0.0.1
      description: Binding host
    port:
      default: '27124'
      description: HTTPS port
- description: HTTP (Insecure Mode)
  url: http://{host}:{port}
  variables:
    host:
      default: 127.0.0.1
      description: Binding host
    port:
      default: '27123'
      description: HTTP port
security:
- apiKeyAuth: []
tags:
- name: Commands
paths:
  /commands/:
    get:
      responses:
        '200':
          content:
            application/json:
              example:
                commands:
                - id: global-search:open
                  name: 'Search: Search in all files'
                - id: graph:open
                  name: 'Graph view: Open graph view'
              schema:
                properties:
                  commands:
                    items:
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                      type: object
                    type: array
                type: object
          description: A list of available commands.
      summary: Get a list of available commands
      tags:
      - Commands
      operationId: getCommands
      x-operation-id-source: derived
  /commands/{commandId}/:
    post:
      parameters:
      - description: The id of the command to execute
        in: path
        name: commandId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Success
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The command you specified does not exist.
      summary: Execute a command
      tags:
      - Commands
      operationId: postCommandsByCommandId
      x-operation-id-source: derived
components:
  schemas:
    Error:
      properties:
        errorCode:
          description: 'A 5-digit error code uniquely identifying this particular type of error.

            '
          example: 40149
          type: number
        message:
          description: Message describing the error.
          example: A brief description of the error.
          type: string
      type: object
  securitySchemes:
    apiKeyAuth:
      description: 'Find your API Key in your Obsidian settings

        in the "Local REST API" section under "Plugins".

        '
      scheme: bearer
      type: http
